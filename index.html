<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>79th柏葉祭実行委員会企画</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html5-qrcode (QR読み取り) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- canvas-confetti (紙吹雪演出) -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- QRCode.js (印刷用QR生成) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase SDK (v10 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .bg-gradient-custom { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-20">

  <!-- ヘッダー -->
  <header class="bg-gradient-custom text-white p-4 shadow-lg sticky top-0 z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
          <h1 class="font-bold text-lg leading-tight"><i class="fa-solid fa-stamp mr-2"></i>79th柏葉祭実行委員会企画</h1>
        <p class="text-xs text-indigo-100" id="user-display-name">ゲスト プレイヤー</p>
      </div>
      <div class="text-right">
        <span class="text-xs opacity-80 block">獲得ポイント</span>
        <span class="text-2xl font-black text-yellow-300" id="total-points">0 <span class="text-sm font-normal">pt</span></span>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- タブ切り替えボタン -->
    <div class="flex bg-slate-200 p-1 rounded-xl font-bold text-xs">
      <button onclick="switchTab('scan')" id="tab-btn-scan" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-600 transition">
        <i class="fa-solid fa-qrcode mr-1"></i> QRスキャン
      </button>
      <button onclick="switchTab('booths')" id="tab-btn-booths" class="flex-1 py-2 rounded-lg text-slate-600 transition">
        <i class="fa-solid fa-list-check mr-1"></i> 自活一覧
      </button>
      <button onclick="switchTab('ranking')" id="tab-btn-ranking" class="flex-1 py-2 rounded-lg text-slate-600 transition relative">
        <i class="fa-solid fa-trophy mr-1"></i> 順位表
        <span class="inline-block w-2 h-2 bg-red-500 rounded-full absolute top-1 right-2 animate-ping"></span>
      </button>
    </div>

    <!-- 1. QRスキャン・合言葉入力タブ -->
    <section id="tab-scan" class="space-y-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 text-center space-y-3">
        <div class="flex justify-between items-center px-1">
          <h2 class="font-bold text-slate-700 text-sm"><i class="fa-solid fa-camera mr-1"></i> QRコード読み取り</h2>
          <button id="camera-toggle-btn" onclick="toggleCamera()" class="px-3 py-1 bg-indigo-600 text-white rounded-lg font-bold text-xs hover:bg-indigo-700 transition">
            <i class="fa-solid fa-video mr-1"></i> カメラ起動
          </button>
        </div>
        <div id="reader" class="w-full rounded-lg overflow-hidden bg-slate-900 min-h-[200px] flex items-center justify-center">
          <div class="p-8 text-white text-xs flex flex-col items-center justify-center">
            <i class="fa-solid fa-video-slash text-2xl mb-2 text-slate-500"></i>
            カメラは停止中です
          </div>
        </div>
      </div>

      <!-- 合言葉入力 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <h3 class="font-bold text-xs text-slate-500 mb-2"><i class="fa-solid fa-key mr-1"></i> 合言葉を入力する</h3>
        <div class="flex gap-2">
          <input type="text" id="passcode-input" placeholder="例: 101" maxlength="6" class="flex-1 border rounded-lg px-3 py-2 text-center text-lg font-mono focus:ring-2 focus:ring-indigo-500 outline-none">
          <button onclick="submitPasscode()" class="bg-indigo-600 text-white font-bold px-4 py-2 rounded-lg hover:bg-indigo-700 transition">送信</button>
        </div>
      </div>
    </section>

    <!-- 2. ブース一覧タブ -->
    <section id="tab-booths" class="hidden space-y-3">
      <div class="text-xs text-slate-500 flex justify-between items-center">
        <span>全 <span id="booth-count">0</span> ブース</span>
        <span>巡回済み: <span id="cleared-count" class="font-bold text-indigo-600">0</span></span>
      </div>
      <div id="booth-list" class="space-y-2"></div>
    </section>

    <!-- 3. リアルタイムランキングタブ -->
    <section id="tab-ranking" class="hidden space-y-3">
      <div class="bg-gradient-to-r from-amber-500 to-yellow-400 text-white p-3 rounded-xl shadow-sm flex justify-between items-center">
        <span class="text-xs font-bold"><i class="fa-solid fa-wifi mr-1"></i> リアルタイム順位（全校同期）</span>
        <span class="text-xs bg-white/20 px-2 py-0.5 rounded-full">LIVE</span>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <div id="ranking-list" class="divide-y divide-slate-100">
          <div class="p-4 text-center text-slate-400 text-sm">ランキング読み込み中...</div>
        </div>
      </div>
    </section>

  </main>

  <!-- フッター -->
  <footer class="text-center text-xs text-slate-400 my-8 space-y-3">
    <div>
      <button onclick="resetMyData()" class="text-slate-400 hover:text-red-500 transition underline mr-4">
        <i class="fa-solid fa-rotate-left mr-1"></i>自分のデータをリセット
      </button>
      <button onclick="openAdminModal()" class="underline hover:text-slate-600">
        <i class="fa-solid fa-lock mr-1"></i>実行委員会・管理モード
      </button>
    </div>
  </footer>

  <!-- 名前入力モーダル -->
  <div id="name-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h3 class="font-bold text-lg text-slate-800">スタンプラリー参加</h3>
      <p class="text-xs text-slate-500">ランキングに表示されるニックネームを入力してください（学年とクラスを必ず入れてください）</p>
      <input type="text" id="username-input" placeholder="例: 2-8 米東三郎" maxlength="10" class="w-full border rounded-lg p-2 text-center text-base focus:ring-2 focus:ring-indigo-500 outline-none">
      <button onclick="saveUsername()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg hover:bg-indigo-700 transition">スタート！</button>
    </div>
  </div>

  <!-- 管理者モーダル -->
  <div id="admin-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800"><i class="fa-solid fa-gear mr-1"></i> 柏葉祭実行委員会 管理パネル</h3>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      
      <div id="admin-login-view" class="space-y-3">
        <p class="text-xs text-slate-500">管理者パスコードを入力してください</p>
        <input type="password" id="admin-passcode" placeholder="パスコード " class="w-full border rounded-lg p-2 text-center font-mono">
        <button onclick="checkAdminPasscode()" class="w-full bg-slate-800 text-white font-bold py-2 rounded-lg">認証</button>
      </div>

      <div id="admin-content-view" class="hidden space-y-4">
        <!-- 管理者全リセットボタン -->
        <div class="bg-red-50 border border-red-200 p-3 rounded-lg space-y-2">
          <div class="font-bold text-xs text-red-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i>全データ一括リセット</div>
          <p class="text-[11px] text-red-600">全参加者のランキングデータを完全に消去します。</p>
          <button onclick="resetAllDatabaseData()" class="w-full bg-red-600 text-white font-bold text-xs py-2 rounded-lg hover:bg-red-700 transition">全参加者のデータを一括消去</button>
        </div>

        <div class="bg-indigo-50 p-3 rounded-lg text-xs text-indigo-700">
          <i class="fa-solid fa-circle-info mr-1"></i> 各自活会場用QRコード一覧です。印刷して各所に掲示してください。
        </div>
        <div id="admin-qr-container" class="space-y-4"></div>
      </div>
    </div>
  </div>

  <!-- ジャバスクリプト -->
  <script>
    // 1. Firebase 初期化設定
    const firebaseConfig = {
      apiKey: "AIzaSyAtCYCd2i_mO1WsBbpbgeDRCZSGucbLUnY",
      authDomain: "hakuyo-79th-ukiuki.firebaseapp.com",
      projectId: "hakuyo-79th-ukiuki",
      storageBucket: "hakuyo-79th-ukiuki.firebasestorage.app",
      messagingSenderId: "480597223053",
      appId: "1:480597223053:web:cae0af0be78fc932c7e4c4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. パスコード・自活会場定義
    const ADMIN_PASSCODE = "79th Make a miracle happen";

    const BOOTHS = [
      { id: 'b1', name: '1年A組 縁日屋台', points: 10, code: '101' },
      { id: 'b2', name: '1年B組 迷路アトラクション', points: 10, code: '102' },
      { id: 'b3', name: '2年A組 おばけ屋敷', points: 15, code: '201' },
      { id: 'b4', name: '2年B組 カフェ・喫茶', points: 10, code: '202' },
      { id: 'b5', name: '3年有志 軽音部ライブ', points: 20, code: '301' },
      { id: 'b6', name: '吹奏楽部 定期演奏会', points: 15, code: '302' },
      { id: 'b7', name: '美術部 展示ブース', points: 10, code: '401' },
      { id: 'b8', name: '生徒会 本部企画', points: 10, code: '901' }
    ];

    // 3. ユーザー識別ID＆状態
    let userId = localStorage.getItem('stamp_user_id');
    if (!userId) {
      userId = 'user_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
      localStorage.setItem('stamp_user_id', userId);
    }

    let username = localStorage.getItem('stamp_username') || '';
    let visitedBooths = JSON.parse(localStorage.getItem('stamp_visited_booths') || '[]');
    let html5QrCode = null;
    let isCameraActive = false;

    // 4. 初期起動
    window.addEventListener('DOMContentLoaded', () => {
      renderBooths();
      updateProgress();
      listenToRealtimeRanking();

      if (!username) {
        document.getElementById('name-modal').classList.remove('hidden');
      } else {
        updateUserInfoUI();
        syncToFirebase();
      }
    });

    function saveUsername() {
      const input = document.getElementById('username-input').value.trim();
      if (!input) return alert('名前を入力してください！');
      username = input;
      localStorage.setItem('stamp_username', username);
      document.getElementById('name-modal').classList.add('hidden');
      updateUserInfoUI();
      syncToFirebase();
    }

    function updateUserInfoUI() {
      document.getElementById('user-display-name').innerText = username ;
    }

    // 5. カメラON/OFF切り替え
    async function toggleCamera() {
      if (isCameraActive) {
        if (html5QrCode) {
          try {
            await html5QrCode.stop();
          } catch(e) { console.log(e); }
        }
        isCameraActive = false;
        const btn = document.getElementById('camera-toggle-btn');
        btn.innerHTML = '<i class="fa-solid fa-video mr-1"></i> カメラ起動';
        btn.className = 'px-3 py-1 bg-indigo-600 text-white rounded-lg font-bold text-xs hover:bg-indigo-700 transition';
        
        document.getElementById('reader').innerHTML = `
          <div class="p-8 text-white text-xs flex flex-col items-center justify-center">
            <i class="fa-solid fa-video-slash text-2xl mb-2 text-slate-500"></i>
            カメラは停止中です
          </div>
        `;
      } else {
        startQRScanner();
      }
    }

    function startQRScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      
      const btn = document.getElementById('camera-toggle-btn');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> 起動中...';

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        (decodedText) => {
          const booth = BOOTHS.find(b => b.id === decodedText || b.code === decodedText);
          if (booth) {
            addPoint(booth.id);
          } else {
            alert('無効なスタンプ用QRコードです');
          }
        },
        () => {}
      ).then(() => {
        isCameraActive = true;
        btn.innerHTML = '<i class="fa-solid fa-video-slash mr-1"></i> カメラOFF';
        btn.className = 'px-3 py-1 bg-slate-200 text-slate-700 rounded-lg font-bold text-xs hover:bg-slate-300 transition';
      }).catch(err => {
        isCameraActive = false;
        btn.innerHTML = '<i class="fa-solid fa-video mr-1"></i> カメラ起動';
        btn.className = 'px-3 py-1 bg-indigo-600 text-white rounded-lg font-bold text-xs hover:bg-indigo-700 transition';
        document.getElementById('reader').innerHTML = `
          <div class="p-8 text-white text-xs flex flex-col items-center justify-center">
            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2 text-amber-400"></i>
            カメラを起動できませんでした<br>下の「コード」をご利用ください
          </div>
        `;
      });
    }

    // 6. ポイント＆データ同期
    function addPoint(boothId) {
      const booth = BOOTHS.find(b => b.id === boothId);
      if (!booth) return;

      if (visitedBooths.includes(boothId)) {
        alert('このブースのポイントは獲得済みです！');
        return;
      }

      visitedBooths.push(boothId);
      localStorage.setItem('stamp_visited_booths', JSON.stringify(visitedBooths));

      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      alert('『${booth.name}』のポイント（${booth.points}pt）を獲得しました！`);

      renderBooths();
      updateProgress();
      syncToFirebase();
    }

    function getTotalPoints() {
      return visitedBooths.reduce((total, id) => {
        const b = BOOTHS.find(item => item.id === id);
        return total + (b ? b.points : 0);
      }, 0);
    }

    function syncToFirebase() {
      if (!username) return;
      const pts = getTotalPoints();
      
      db.collection("rankings").doc(userId).set({
        name: username,
        points: pts,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }

    // 7. 自分のデータを消去（初期化）する処理
    async function resetMyData() {
      if (!confirm('自分のポイントとスタンプを初期化しますか？')) return;
      
      // スマホ内のデータを消去
      visitedBooths = [];
      localStorage.removeItem('stamp_visited_booths');
      
      // Firebase上の自分のデータも削除
      try {
        await db.collection("rankings").doc(userId).delete();
      } catch(e) {
        console.log(e);
      }

      renderBooths();
      updateProgress();
      alert('自分のデータとポイントをリセットしました！');
    }

    // 管理者用全データリセット
    async function resetAllDatabaseData() {
      if (!confirm('【警告】本当に全参加者のランキングデータを完全に全削除しますか？\nこの操作は取り消せません。')) return;
      
      try {
        const snapshot = await db.collection("rankings").get();
        const batch = db.batch();
        snapshot.forEach(doc => {
          batch.delete(doc.ref);
        });
        await batch.commit();
        alert('全参加者のランキングデータをリセットしました。');
      } catch (err) {
        alert('リセット処理中にエラーが発生しました: ' + err.message);
      }
    }

    // 8. リアルタイムランキング受診
    function listenToRealtimeRanking() {
      db.collection("rankings")
        .orderBy("points", "desc")
        .limit(30)
        .onSnapshot((snapshot) => {
          const listContainer = document.getElementById('ranking-list');
          listContainer.innerHTML = '';

          if (snapshot.empty) {
            listContainer.innerHTML = '<div class="p-4 text-center text-slate-400 text-sm">まだ参加者がいません</div>';
            return;
          }

          let rank = 1;
          snapshot.forEach((doc) => {
            const data = doc.data();
            const isMe = doc.id === userId;

            let rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 font-bold text-xs flex items-center justify-center">${rank}</span>`;
            if (rank === 1) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-400 text-white font-bold text-xs flex items-center justify-center">🥇</span>`;
            if (rank === 2) rankBadge = `<span class="w-6 h-6 rounded-full bg-slate-300 text-white font-bold text-xs flex items-center justify-center">🥈</span>`;
            if (rank === 3) rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-600 text-white font-bold text-xs flex items-center justify-center">🥉</span>`;

            const item = document.createElement('div');
            item.className = `p-3 flex justify-between items-center ${isMe ? 'bg-indigo-50 font-bold border-l-4 border-indigo-600' : ''}`;
            item.innerHTML = `
              <div class="flex items-center gap-3">
                ${rankBadge}
                <span class="text-sm ${isMe ? 'text-indigo-900' : 'text-slate-700'}">${data.name || '名無し'} ${isMe ? '<span class="text-[10px] bg-indigo-200 text-indigo-800 px-1 rounded ml-1">自分</span>' : ''}</span>
              </div>
              <span class="font-mono font-bold text-indigo-600">${data.points || 0} pt</span>
            `;
            listContainer.appendChild(item);
            rank++;
          });
        });
    }

    // 9. UIレンダリング・タブ
    function updateProgress() {
      const currentPts = getTotalPoints();
      const maxPts = BOOTHS.reduce((sum, b) => sum + b.points, 0);
      const percent = Math.min(100, Math.round((currentPts / maxPts) * 100));

      document.getElementById('total-points').innerHTML = `${currentPts} <span class="text-sm font-normal">pt</span>`;
      document.getElementById('progress-percent').innerText = `${percent}%`;
      document.getElementById('progress-bar').style.width = `${percent}%`;

      if (currentPts >= 30) document.getElementById('reward-1').className = 'p-1 rounded bg-pink-100 text-pink-700 font-bold';
      if (currentPts >= 60) document.getElementById('reward-2').className = 'p-1 rounded bg-pink-100 text-pink-700 font-bold';
      if (currentPts >= 100) document.getElementById('reward-3').className = 'p-1 rounded bg-pink-100 text-pink-700 font-bold';
    }

    function renderBooths() {
      const container = document.getElementById('booth-list');
      container.innerHTML = '';
      document.getElementById('booth-count').innerText = BOOTHS.length;
      document.getElementById('cleared-count').innerText = visitedBooths.length;

      BOOTHS.forEach(b => {
        const isDone = visitedBooths.includes(b.id);
        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl border flex justify-between items-center ${isDone ? 'bg-slate-50 border-slate-200' : 'bg-white border-slate-200 shadow-sm'}`;
        card.innerHTML = `
          <div>
            <div class="font-bold text-sm ${isDone ? 'line-through text-slate-400' : 'text-slate-800'}">${b.name}</div>
            <div class="text-xs text-indigo-500 font-semibold">+${b.points} pt</div>
          </div>
          <div>
            ${isDone ? 
              '<span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-1 rounded-full font-bold"><i class="fa-solid fa-check"></i> 獲得済み</span>' : 
              '<span class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-full">未達成</span>'}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchTab(tabName) {
      ['scan', 'booths', 'ranking'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-btn-${t}`);
        btn.className = 'flex-1 py-2 rounded-lg text-slate-600 transition';
      });

      document.getElementById(`tab-${tabName}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-btn-${tabName}`);
      activeBtn.className = 'flex-1 py-2 rounded-lg bg-white shadow-sm text-indigo-600 font-bold transition';
    }

    function submitPasscode() {
      const val = document.getElementById('passcode-input').value.trim();
      const booth = BOOTHS.find(b => b.code === val);
      if (booth) {
        addPoint(booth.id);
        document.getElementById('passcode-input').value = '';
      } else {
        alert('コードが違います。各自活会場の掲示を確認してください。');
      }
    }

    // 10. 管理者機能
    function openAdminModal() {
      document.getElementById('admin-modal').classList.remove('hidden');
    }
    function closeAdminModal() {
      document.getElementById('admin-modal').classList.add('hidden');
    }

    function checkAdminPasscode() {
      const val = document.getElementById('admin-passcode').value;
      if (val === ADMIN_PASSCODE) {
        document.getElementById('admin-login-view').classList.add('hidden');
        document.getElementById('admin-content-view').classList.remove('hidden');
        generateAdminQRs();
      } else {
        alert('パスコードが正しくありません');
      }
    }

    function generateAdminQRs() {
      const container = document.getElementById('admin-qr-container');
      container.innerHTML = '';

      BOOTHS.forEach(b => {
        const box = document.createElement('div');
        box.className = 'border p-3 rounded-lg text-center bg-white space-y-2';
        box.innerHTML = `
          <div class="font-bold text-sm">${b.name}</div>
          <div class="text-xs text-slate-500">ポイント: ${b.points}pt | 合言葉: <span class="font-mono font-bold text-red-500">${b.code}</span></div>
          <div id="qr-${b.id}" class="flex justify-center py-2"></div>
        `;
        container.appendChild(box);

        new QRCode(document.getElementById(`qr-${b.id}`), {
          text: b.id,
          width: 128,
          height: 128
        });
      });
    }
  </script>
</body>
</html>
